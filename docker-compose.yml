version: '3.8'

services:
  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cg_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./.env
    # Reducimos los recursos al máximo aprovechando Alpine y Fastify
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - cg_network

  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cg_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Dependiendo de tu config, env_file pasará las variables. Vite necesita import.meta.env, así que usualmente se inyectan en el Build en el Dockerfile o viajen directas, pero en Nginx son estáticas
      - NODE_ENV=production
    env_file:
      - ./.env
    depends_on:
      - backend-service
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - cg_network

networks:
  cg_network:
    driver: bridge
