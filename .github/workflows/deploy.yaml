name: CI/CD Control de Gastos

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir a minúsculas el nombre de usuario
        run: |
          echo "ACTOR_LC=${ACTOR,,}" >>${GITHUB_ENV}
        env:
          ACTOR: '${{ github.actor }}'

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: ghcr.io/${{ env.ACTOR_LC }}/control-gastos-backend:latest

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: ghcr.io/${{ env.ACTOR_LC }}/control-gastos-frontend:latest
